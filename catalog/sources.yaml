# Catalog of every data source for the study — scripted or not.
#
# access:  api     = server-side filtered queries (ArcGIS REST, Socrata, CKAN, Overpass, Census)
#          bulk    = whole files downloaded/streamed, then filtered locally
#          manual  = you download it by hand (login / CAPTCHA / hand collection)
#          token   = scripted, but needs a free key in .env
#          request = must be requested from an agency
# storage: release    = safe to publish as a GitHub Release asset (open license; attribute)
#          restricted = keep local (data/restricted/); never commit or publish
#          none       = reference only / nothing stored
# Facts below were checked on 2026-09-27 unless marked "(unverified)".

sources:

# ---------------------------------------------------------------- crashes
- id: ccrs
  name: CCRS — California Crash Reporting System (Crashes, Parties, InjuredWitnessPassengers)
  publisher: California Highway Patrol, via data.ca.gov
  url: https://data.ca.gov/dataset/ccrs
  access: bulk
  script: python download.py ccrs --years 2016-2026
  output: data/processed/ccrs/{crashes,parties,injured}_YYYY.parquet
  storage: release
  license: Public domain
  coverage: 2016–2026 statewide (2025 provisional, 2026 partial); Alameda = County Code 1, ~17–20k crashes/yr
  has: [crash date/time, city, collision type, primary collision factor (vehicle code), lighting, weather,
        pedestrian action, IsFreeway, primary/secondary road + distance/direction, Latitude/Longitude,
        killed/injured counts, party role/age/sex/race/sobriety/vehicle/SpeedLimit, injury extent per person,
        property-damage-only crashes]
  lacks: [coordinates for ~35% of Alameda injury crashes (Oakland 2024 - 31% have them), severity column on
          the crash table, segment/intersection IDs, road features, traffic volumes, narratives]
  gotchas:
    - The data.ca.gov SQL API copy of 2019 is truncated (Jan 1–Apr 8); the CSV is complete — script uses CSVs.
    - CSV headers contain stray tab characters (script strips column names; values untouched).
    - 2017/2019/2021 dates are M/D/YYYY h:mm:ss AM; other years ISO.
    - Duplicate report versions exist — dedupe on Collision Id keeping the highest Report Version; drop IsDeleted.
    - Key is "Collision Id" in Crashes but "CollisionId" in Parties/Injured.
    - Injury codes mix new (SuspectSerious, SuspectMinor, PossibleInjury, Fatal) and legacy (*Inactive) values.
    - Files are regenerated daily — the pull log records sha256 of every file used.

- id: tims
  name: TIMS — SafeTREC Transportation Injury Mapping System (geocoded SWITRS)
  publisher: UC Berkeley SafeTREC
  url: https://tims.berkeley.edu
  access: manual
  script: python download.py tims   # ingests CSVs you put in data/manual/tims/
  output: data/restricted/tims/*.parquet
  storage: restricted
  license: "Attribution required; no use in litigation against state/local agencies; redistribution not addressed"
  coverage: last 10 years final + provisional 2024+; injury crashes only
  has: [SafeTREC geocodes POINT_X/POINT_Y (~97% statewide), officer lat/long, crash/party/victim tables]
  lacks: [property-damage-only crashes]
  how: >
    Create a free TIMS account, SWITRS Query & Map -> Alameda County -> years -> download Crashes,
    Parties, Victims CSVs into data/manual/tims/, then run `python download.py tims`.
    Ask tims_info@berkeley.edu before publishing raw TIMS extracts.

- id: fars
  name: FARS — Fatality Analysis Reporting System
  publisher: NHTSA
  url: https://static.nhtsa.gov/nhtsa/downloads/FARS/
  access: bulk
  script: python download.py fars
  output: data/processed/fars/{accident,person,vehicle}_YYYY.parquet
  storage: release
  license: Public domain (U.S. Government)
  coverage: 2016–2024 (2024 is an Annual Report File, not final; 2025 not yet posted)
  has: [every fatal crash with coordinates, persons, vehicles]
  lacks: [non-fatal crashes]
  use: independent check on CCRS death counts

- id: epicenter
  name: CDPH EpiCenter (incl. Crash Medical Outcomes Data)
  publisher: California Department of Public Health
  url: https://skylab4.cdph.ca.gov/epicenter/
  access: manual
  storage: none
  license: Public (aggregate tables)
  has: [county-level traffic-injury deaths, hospitalizations, ED visits; crash-hospital linked outcomes; 2024 added Feb 2026]
  lacks: [locations]
  how: Query county tables in the web tool; cite in the limitations section (police under-reporting).

- id: street_story
  name: Street Story (crowdsourced near misses / hazards)
  publisher: UC Berkeley SafeTREC
  url: https://streetstory.berkeley.edu/
  access: manual
  storage: restricted
  license: (unverified)
  has: [self-reported crashes, near misses, hazards; downloadable tables]
  lacks: [representativeness — reporters are self-selected]
  how: Optional. Download Alameda records from the Street Story site; check terms before publishing.

# ---------------------------------------------------------------- roads, volumes, speed
- id: osm
  name: OpenStreetMap — roads, traffic control, destinations
  publisher: OpenStreetMap contributors, via Overpass API
  url: https://overpass-api.de
  access: api
  script: python download.py osm
  output: data/processed/osm/{highways.osm.bz2, traffic_control.geojson, pois.geojson}
  storage: release
  license: ODbL 1.0 — attribute "© OpenStreetMap contributors"; derived databases must be ODbL
  has: [full road network with class/lanes/maxspeed tags, ~13.9k stop-sign nodes, ~4.3k signal nodes,
        ~6.7k traffic-calming nodes, crossings, schools/hospitals/parks/bus stops]
  lacks: [even coverage (stop signs ~absent in Pleasanton, Fremont, Dublin, Newark), install dates,
          volumes; node counts != intersections]
  gotchas:
    - maxspeed on 33% of drivable ways overall; 9% (San Leandro) to 96% (Berkeley) by city.
    - Snapshot changes daily — the pull log records Overpass's osm_base timestamp.

- id: county_street_centerlines
  name: Alameda County Street Centerlines
  publisher: Alameda County (data.acgov.org)
  url: https://data.acgov.org/
  access: api
  script: python download.py county_gis
  output: data/processed/county_gis/street_centerlines.geojson
  storage: release
  license: Alameda County open data terms (not reviewed)
  has: [85,140 segments, street name parts, left/right address ranges, city/zip L/R, class, travel direction]
  lacks: [lanes, speed, volume]
  use: geocode CCRS crashes that lack coordinates (PrimaryRoad x SecondaryRoad, address ranges)

- id: county_cities
  name: Alameda County city boundaries
  publisher: Alameda County (data.acgov.org)
  url: https://data.acgov.org/
  access: api
  script: python download.py county_gis
  storage: release
  license: Alameda County open data terms (not reviewed)

- id: tiger
  name: Census TIGER boundaries (county, tracts, block groups, places) — ACS-vintage matched
  publisher: U.S. Census Bureau (TIGERweb)
  url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb
  access: api
  script: python download.py census --only boundaries
  storage: release
  license: Public domain

- id: caltrans_aadt
  name: Caltrans Traffic Volumes (AADT), state highways
  publisher: Caltrans
  url: https://gisdata-caltrans.opendata.arcgis.com/datasets/d8833219913c44358f2a9a71bda57f76_0/about
  access: api
  script: python download.py caltrans
  storage: release
  license: California open data
  coverage: 2023 count year; 450 points in Alameda
  lacks: [local streets — mostly freeways]

- id: hpms
  name: HPMS — Highway Performance Monitoring System (California), 2020/2022/2023/2024
  publisher: FHWA (geo.dot.gov)
  url: https://geo.dot.gov/server/rest/services/Hosted/HPMS_FULL_CA_2024/FeatureServer
  access: api
  script: python download.py hpms
  storage: release
  license: Public domain (U.S. Government)
  has: [~29k Alameda sections (2024) with AADT, lanes, speed limit, functional class, signal/stop counts;
        AADT complete for f_system 1–5 in every year]
  lacks: [real AADT on local streets; speed_limit sparse; no 2021 service]
  gotchas:
    - Filtered spatially — the county attribute is unreliable (2023 county_id=1 matches statewide routes).
    - 2020 has 38,258 duplicate geometries out of 64,375 sections — dedupe.
    - 2022/2023 local-street AADT is a placeholder (405 / 397 on >90% of sections) — not a count.
    - Field names change between years.
  use: the only public arterial traffic-volume source found — exposure for arterial models

- id: alacc_inrix
  name: AlaCC travel-model link volumes and INRIX speeds (what Alameda CTC's PSN used)
  publisher: Alameda CTC / INRIX
  url: https://www.alamedactc.org/
  access: request
  storage: restricted
  license: Agency / commercial
  how: Email Alameda CTC planning staff; ask for modeled ADT and observed-speed layers for research use.

- id: speed_limit_history
  name: Posted speed-limit changes (Oakland AB 43 business districts 2023–2025, etc.)
  publisher: OakDOT and other cities
  url: https://www.oaklandca.gov/Government/Oakland-Improvement-Projects/Lowering-Speed-Limits-in-Business-Activity-Districts
  access: request
  storage: release
  license: Public records
  how: Ask OakDOT for streets + effective dates of speed-limit changes; no public inventory exists.

